name: RDP-Kali

on:
  workflow_dispatch:

jobs:
  secure-rdp-kali:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Install XFCE Desktop and RDP Server
        run: |
          # Update system
          sudo apt update -y
          
          # Install XFCE desktop environment
          sudo DEBIAN_FRONTEND=noninteractive apt install -y xfce4 xfce4-goodies
          
          # Install xrdp server
          sudo apt install -y xrdp
          
          # Configure xrdp to use XFCE
          echo "xfce4-session" | sudo tee /etc/xrdp/startwm.sh
          sudo chmod +x /etc/xrdp/startwm.sh
          
          # Restart xrdp service
          sudo systemctl restart xrdp
          sudo systemctl enable xrdp

      - name: Install Additional Tools
        run: |
          sudo apt install -y \
            firefox-esr \
            terminator \
            nautilus \
            vim \
            thunar \
            xfce4-terminal

      - name: Configure RDP Security Settings
        run: |
          # Configurar xrdp
          sudo sed -i 's/port=3389/port=3389/g' /etc/xrdp/xrdp.ini
          
          # Permitir en firewall
          sudo ufw allow 3389/tcp 2>/dev/null || true
          sudo ufw reload 2>/dev/null || true

      - name: Create RDP User with Secure Password
        run: |
          # Generar contraseña segura
          PASSWORD=$(openssl rand -base64 12 | tr -d '/+=' | head -c 16)
          
          # Crear usuario
          sudo useradd -m -s /bin/bash rdpuser
          echo "rdpuser:$PASSWORD" | sudo chpasswd
          
          # Agregar al grupo sudo
          sudo usermod -aG sudo rdpuser
          
          # Guardar credenciales
          echo "RDP_CREDS=User: rdpuser | Password: $PASSWORD" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          # Instalar Tailscale
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          
          # Iniciar Tailscale
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=kali-runner-${{ github.run_id }}
          
          # Esperar IP
          sleep 10
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          echo "Tailscale IP: $env:TAILSCALE_IP"
          
          # Verificar que xrdp está corriendo
          sudo systemctl status xrdp --no-pager
          
          # Test de conectividad local
          nc -zv localhost 3389 || echo "Port check completed"
          
          echo "RDP está listo para conexiones!"

      - name: Maintain Connection
        run: |
          echo "=== RDP ACCESS ==="
          echo "Address: $env:TAILSCALE_IP"
          echo "Username: rdpuser"
          echo "Password: $(echo $env:RDP_CREDS)"
          echo "=================="
          
          # Mantener el runner activo
          while true; do
            echo "[$(date)] RDP Active - Use Ctrl+C in workflow to terminate"
            sleep 300
          done
